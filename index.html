<!doctype html>
<html lang="eu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TETRA IRRATIAK</title>
<link rel="stylesheet" href="styles.css?v=20261007-2210">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brandText"><h1>TETRA IRRATIAK</h1><p>Irrati eta mugimenduen kudeaketa</p></div>
  </div>
  <nav class="mainnav">
    <button class="navBtn active" id="navRadios">▣ <span>Irratiak</span></button>
    <button class="navBtn" id="navMov">☷ <span>Mugimenduak</span></button>
    <button class="navBtn" id="navHist">◷ <span>Historia</span></button>
    <button class="navBtn" id="navExp">⇩ <span>Esportatu</span></button>
  </nav>
  <button id="logout" class="logout">♙&nbsp; Irten</button>
</header>

<main>
  <section id="login" hidden>
    <div class="loginCard">
      <h2>Sarbidea</h2>
      <p>Sartu TETRA irratiak kudeatzeko.</p>
      <form id="loginForm">
        <input id="email" type="email" placeholder="Posta elektronikoa" required>
        <input id="password" type="password" placeholder="Pasahitza" required>
        <button>Sartu</button>
      </form>
      <div id="mezua"></div>
    </div>
  </section>

  <section id="app" hidden>
    <div class="toolbar">
      <div class="searchBox"><span>⌕</span><input id="bilaketa" placeholder="Bilatu... (ZKA, alias, marka, modeloa, TEI...)" autocomplete="off"></div>
      <select id="egoeraFilter"><option value="">Egoera: Guztiak</option><option value="aktibo">Egoera: Aktiboak</option><option value="ordezkatua">Egoera: Ordezkatuak</option><option value="baja">Egoera: Behin betiko baja</option></select>
      <select id="motaFilter"><option value="">Saila: Guztiak</option></select>
      <select id="kokapenaFilter"><option value="">Kokapena: Guztiak</option></select>
      <button id="irratiBerria" class="primaryBtn">＋&nbsp; Irrati berria</button>
    </div>

    <div class="mainGrid">
      <section id="radioList" class="radioList card">
        <div class="sectionTitle"><h2>Irratiak <span id="irratiaKop">(0)</span></h2></div>
        <div class="tableScroll">
          <table class="radioTable">
            <thead><tr><th>Kodea</th><th>Marka</th><th>Modeloa</th><th>TEI</th><th>ZKA</th><th>Saila</th><th>Egoera</th><th>Kokapena</th></tr></thead>
            <tbody id="irratiaRows"></tbody>
          </table>
        </div>
        <div id="radioPagination" class="pagination" aria-label="Irratien orriak"></div>
      </section>

      <aside id="detailCard" class="detailCard card" hidden>
        <div class="detailHead">
          <div><h2 id="izenburua">—</h2><span id="statusBurua" class="status active">Aktibo</span></div>
        </div>
        <div class="detailMain">
          <div class="detailPhoto"><img id="radioPhoto" src="data/talkie.png" alt="Talkie"></div>
          <div id="datuak" class="meta"></div>
        </div>
        <div class="detailActions">
          <button id="editIrratia" class="actionBtn primary">✎&nbsp; Editatu</button>
          <button id="historiala" class="actionBtn">◷&nbsp; Historia</button>
          <button id="mugimenduBerria" class="actionBtn">＋&nbsp; Mugimendu berria</button>
        </div>
      </aside>
    </div>

    <section id="movementSection" class="movementCard card" hidden>
      <div class="movementHead"><h2>◷&nbsp; Mugimenduak <span id="movementTitle"></span></h2><span id="mugimenduKop"></span></div>
      <div class="tableScroll">
        <table class="movementTable">
          <thead><tr><th>Data</th><th>Mugimendua</th><th>Nork</th><th>Arreta Zb.</th><th>RMA</th><th>Oharrak</th><th></th></tr></thead>
          <tbody id="mugimenduRows"></tbody>
        </table>
      </div>
    </section>

    <section id="editPanela" class="formCard card" hidden>
      <h3>Irratia editatu</h3>
      <form id="irratiForm">
        <input id="id" type="hidden">
        <div class="formgrid"><label>ZKA<input id="zka" type="number"></label><label>Alias<input id="alias"></label><label>Marka<input id="marka"></label><label>Modeloa<input id="modelo"></label><label>TEI<input id="tei" type="number"></label><label>Saila<input id="mota"></label><label>Kokapena<input id="kokapena"></label></div>
        <div class="checks"><label><input id="gps" type="checkbox"> GPS</label><label><input id="gateway" type="checkbox"> Gateway</label><label><input id="baja_definitiva" type="checkbox"> Behin betiko baja</label><label><input id="sustituido" type="checkbox"> Ordezkatua</label></div>
        <div class="formButtons"><button class="primaryBtn">Gorde</button><button type="button" id="cancelEdit" class="actionBtn">Utzi</button></div>
      </form>
    </section>

    <section id="mugimenduEditPanela" class="formCard card" hidden>
      <h3 id="mugimenduFormTitle">Mugimendu berria</h3>
      <form id="mugimenduForm"><input id="mugimenduId" type="hidden"><div class="formgrid"><label>Nork<input id="m_nork"></label><label>Hasiera<input id="m_noiztik" type="date"></label><label>Amaiera<input id="m_noizarte" type="date"></label><label>Arrazoia<input id="m_zergatia"></label><label>Bateria<input id="m_bateria" type="number" step="any"></label><label>Arreta Zb.<input id="m_arreta" type="number" step="any"></label><label>RMA<input id="m_teltronic"></label></div><div class="checks"><label><input id="m_funda" type="checkbox"> Funda</label><label><input id="m_micro" type="checkbox"> Mikroa</label><label><input id="m_karga" type="checkbox"> Karga</label><label><input id="m_kablea" type="checkbox"> 12V kablea</label></div><div class="formButtons"><button class="primaryBtn">Gorde</button><button type="button" id="cancelMugimendu" class="actionBtn">Utzi</button></div></form>
    </section>
  </section>
</main>

<div id="histModal" class="modal" hidden><div class="modalbox"><div class="modalhead"><h2 id="histTitle">Historia</h2><button id="closeHist">×</button></div><div id="histContent" class="modalContent"></div></div></div>
<input id="editatzeko" type="hidden">
<script type="module" src="app.js?v=20261007-2210"></script>
</body>
</html>
